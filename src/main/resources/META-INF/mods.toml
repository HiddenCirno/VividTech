modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = "VividTech - steam-era machines and modules for GTCEu/GTLCore."

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gtceu"
mandatory = true
versionRange = "[${gtceu_version},1.4.5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gtlcore"
mandatory = true
versionRange = "[1.2.3,1.3)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ldlib"
mandatory = false
versionRange = "[1.0.29.b,1.0.34)"
ordering = "AFTER"
side = "BOTH"
